<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cartelería Dinámica</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    .grid-container {
      display: grid;
      grid-template-columns: 70% 30%;
      grid-template-rows: 50% 50%;
      height: 100vh;
      width: 100vw;
    }
    .zona-video { grid-column: 1 / 2; grid-row: 1 / 3; }
    .zona-img-1 { grid-column: 2 / 3; grid-row: 1 / 2; }
    .zona-img-2 { grid-column: 2 / 3; grid-row: 2 / 3; }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="zona-video"><video id="reproductorVideo" autoplay muted playsinline></video></div>
    <div class="zona-img-1"><img id="promo1" src="" alt=""></div>
    <div class="zona-img-2"><img id="promo2" src="" alt=""></div>
  </div>

  <script>
    const API_URL = 'https://gist.githubusercontent.com/user-campesino-admin/fcca2e215454448546e6df16a6e416a4/raw/promos.json';

    let datosRemotos = { videos: [], imagenes: [] };
    let indiceVideo = 0;
    let indiceImg1 = 0;
    let indiceImg2 = 1;

    async function descargarConfig() {
      try {
        // TRUCO ANTICACHÉ: Añade la hora actual al enlace para que GitHub no envíe datos viejos
        const urlSinCache = API_URL + "?t=" + new Date().getTime();
        const respuesta = await fetch(urlSinCache);
        
        datosRemotos = await respuesta.json();
        console.log("Datos cargados correctamente:", datosRemotos);
      } catch (error) {
        console.error("Error al descargar el JSON:", error);
      }
    }

    async function reproducirSiguienteVideo() {
      if (!datosRemotos.videos || datosRemotos.videos.length === 0) {
        console.warn("No hay videos en la lista.");
        return;
      }
      
      const videoEl = document.getElementById('reproductorVideo');
      const urlVideo = datosRemotos.videos[indiceVideo];
      
      console.log("Reproduciendo video:", urlVideo);
      videoEl.src = urlVideo;
      
      try {
        await videoEl.play();
      } catch (err) {
        console.error("Error al reproducir el video:", err);
      }

      indiceVideo = (indiceVideo + 1) % datosRemotos.videos.length;
    }

    function rotarImagenes() {
      if (!datosRemotos.imagenes || datosRemotos.imagenes.length === 0) return;
      
      document.getElementById('promo1').src = datosRemotos.imagenes[indiceImg1];
      document.getElementById('promo2').src = datosRemotos.imagenes[indiceImg2];

      indiceImg1 = (indiceImg1 + 1) % datosRemotos.imagenes.length;
      indiceImg2 = (indiceImg2 + 1) % datosRemotos.imagenes.length;
    }

    async function iniciar() {
      await descargarConfig();
      
      reproducirSiguienteVideo();
      const videoEl = document.getElementById('reproductorVideo');
      videoEl.onended = reproducirSiguienteVideo;

      setInterval(rotarImagenes, 10000);
      rotarImagenes();

      setInterval(descargarConfig, 600000);
    }

    iniciar();
  </script>
</body>
</html>
