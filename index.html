<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cartelería Dinámica con Títulos</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; font-family: Arial, sans-serif; }
    
    .grid-container {
      display: grid;
      /* Si cambiaste a 60/40, ajusta aquí la primera columna */
      grid-template-columns: 60% 40%;
      grid-template-rows: 50% 50%;
      height: 100vh;
      width: 100vw;
    }

    /* Estilo general para cada tarjeta/zona con título */
    .panel-zona {
      display: flex;
      flex-direction: column;
      border: 2px solid #1b5e20; /* Borde verde corporativo */
      background: black;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Franja del título */
    .panel-header {
      background-color: #2e7d32; /* Verde El Campesino */
      color: white;
      text-align: center;
      font-weight: bold;
      font-size: 1.5vw; /* El texto se adapta al tamaño del TV */
      padding: 0.5vh 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* Contenedor interno para el video o la imagen */
    .panel-body {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: black;
    }

    /* Posicionamiento en la cuadrícula */
    .zona-principal { grid-column: 1 / 2; grid-row: 1 / 3; }
    .zona-img-1 { grid-column: 2 / 3; grid-row: 1 / 2; }
    .zona-img-2 { grid-column: 2 / 3; grid-row: 2 / 3; }
    
    video, img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
    }
    
    .zona-principal video, .zona-principal img {
      object-fit: cover; /* Llena toda el área principal */
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- ZONA PRINCIPAL (Izquierda) -->
    <div class="panel-zona zona-principal">
      <div class="panel-header" id="tituloPrincipal">OFERTAS ACTUALES</div>
      <div class="panel-body" id="contenedorPrincipal"></div>
    </div>

    <!-- ZONA LATERAL 1 (Derecha Arriba) -->
    <div class="panel-zona zona-img-1">
      <div class="panel-header">RIFAS DEL MES</div>
      <div class="panel-body">
        <img id="promo1" src="" alt="Promo 1">
      </div>
    </div>

    <!-- ZONA LATERAL 2 (Derecha Abajo) -->
    <div class="panel-zona zona-img-2">
      <div class="panel-header">RECETAS CON PRODUCTOS FRESCOS DEL FRUVER</div>
      <div class="panel-body">
        <img id="promo2" src="" alt="Promo 2">
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://gist.githubusercontent.com/user-campesino-admin/fcca2e215454448546e6df16a6e416a4/raw/promos.json';

    let datosRemotos = { videos: [], imagenes: [] };
    let indicePrincipal = 0;
    let indiceImg1 = 0;
    let indiceImg2 = 1;
    let temporizadorImagen = null;

    async function descargarConfig() {
      try {
        const urlSinCache = API_URL + "?t=" + new Date().getTime();
        const respuesta = await fetch(urlSinCache);
        datosRemotos = await respuesta.json();
      } catch (error) {
        console.error("Error al descargar el JSON:", error);
      }
    }

    async function reproducirSiguientePrincipal() {
      if (!datosRemotos.videos || datosRemotos.videos.length === 0) return;
      
      if (temporizadorImagen) clearTimeout(temporizadorImagen);

      const contenedor = document.getElementById('contenedorPrincipal');
      const urlItem = datosRemotos.videos[indicePrincipal];
      
      const esVideo = urlItem.toLowerCase().endsWith('.mp4') || urlItem.includes('mp4');

      contenedor.innerHTML = '';

      if (esVideo) {
        const videoEl = document.createElement('video');
        videoEl.src = urlItem;
        videoEl.autoplay = true;
        videoEl.muted = true;
        videoEl.playsInline = true;
        
        videoEl.onended = () => {
          indicePrincipal = (indicePrincipal + 1) % datosRemotos.videos.length;
          reproducirSiguientePrincipal();
        };

        videoEl.onerror = () => {
          indicePrincipal = (indicePrincipal + 1) % datosRemotos.videos.length;
          reproducirSiguientePrincipal();
        };

        contenedor.appendChild(videoEl);
        try { await videoEl.play(); } catch (err) { console.error(err); }
      } else {
        const imgEl = document.createElement('img');
        imgEl.src = urlItem;
        contenedor.appendChild(imgEl);

        indicePrincipal = (indicePrincipal + 1) % datosRemotos.videos.length;
        temporizadorImagen = setTimeout(reproducirSiguientePrincipal, 12000);
      }
    }

    function rotarImagenes() {
      if (!datosRemotos.imagenes || datosRemotos.imagenes.length === 0) return;
      
      document.getElementById('promo1').src = datosRemotos.imagenes[indiceImg1];
      document.getElementById('promo2').src = datosRemotos.imagenes[indiceImg2];

      indiceImg1 = (indiceImg1 + 1) % datosRemotos.imagenes.length;
      indiceImg2 = (indiceImg2 + 1) % datosRemotos.imagenes.length;
    }

    async function iniciar() {
      await descargarConfig();
      reproducirSiguientePrincipal();
      setInterval(rotarImagenes, 10000);
      rotarImagenes();
      setInterval(descargarConfig, 600000);
    }

    iniciar();
  </script>
</body>
</html>
